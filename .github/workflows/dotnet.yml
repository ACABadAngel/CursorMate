name: .NET build and core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run core smoke tests
        run: dotnet run --project tests/CursorMate.SmokeTests -c Release

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF companion
        run: dotnet build src/CursorMate.Companion -c Release
      - name: Run core smoke tests
        run: dotnet run --project tests/CursorMate.SmokeTests -c Release
